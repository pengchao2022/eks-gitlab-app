
gitlab:
  upgradeCheck:
    enabled: false


  global:
    hosts:
      domain: awsmpc.asia  

    persistence:
      storageClass: gp3

    ingress:
      configureCertmanager: false
      provider: aws
      class: alb
      annotations:
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/group.name: monitoring-group

 
  certmanager:
    install: false

  nginx-ingress:
    enabled: false

  gitlab-runner:
    install: true

  postgresql:
    primary:
      persistence:
        storageClass: gp3
    image:
      registry: docker.io
      repository: bitnami/postgresql
      tag: 14.11.0-debian-12-r0  
    metrics:
      image:
        registry: docker.io
        repository: bitnami/postgres-exporter
        tag: 0.15.0-debian-11-r12  
  redis:
    master:
      persistence:
        storageClass: gp3

  minio:
    persistence:
      storageClass: gp3

  prometheus:
    server:
      persistentVolume:
        storageClass: gp3
