# =======================================================
# GitLab Helm Chart Values (EKS + AWS ALB + gp3 Storage)
# =======================================================

gitlab:

  # 1. 🔑 彻底禁用升级检查（解决全新的初始化安装/跨版本检查报错）
  upgradeCheck:
    enabled: false

  # 2. 全局基础配置
  global:
    hosts:
      domain: awsmpc.asia  # 你的域名，最终访问地址为 gitlab.awsmpc.asia

    # GitLab 原生组件（如 Gitaly）使用的存储类
    persistence:
      storageClass: gp3

    # Ingress 配置：对接 AWS Load Balancer Controller
    ingress:
      configureCertmanager: false
      provider: aws
      class: alb
      annotations:
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/target-type: ip
        # 复用已有的 ALB 分组，节省资源与成本
        alb.ingress.kubernetes.io/group.name: monitoring-group

  # 3. 禁用内置的证书与网关组件（由 AWS ALB 全权接管）
  certmanager:
    install: false

  nginx-ingress:
    enabled: false

  # 4. 可选配置：内置工具链
  gitlab-runner:
    install: true

  # 5. 🔑 为内置的所有第三方依赖组件显式配置 gp3 存储类
  postgresql:
    primary:
      persistence:
        storageClass: gp3
    image:
      registry: docker.io
      repository: bitnami/postgresql
      tag: 14.11.0-debian-12-r0  # 指定可用的新版本 Tag
    metrics:
      image:
        registry: docker.io
        repository: bitnami/postgres-exporter
        tag: 0.15.0-debian-11-r12  # 指定可用的 Exporter Tag
  redis:
    master:
      persistence:
        storageClass: gp3

  minio:
    persistence:
      storageClass: gp3

  prometheus:
    server:
      persistentVolume:
        storageClass: gp3
